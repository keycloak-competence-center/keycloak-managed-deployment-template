# Optional, see vaultAuth.yaml. Syncs a Vault KV v2 secret into the Secret that
# vshnKeycloak.yaml consumes through service.envFrom.
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: keycloak-env
  namespace: <your-namespace>
spec:
  vaultAuthRef: vault-auth
  path: <your-kv-path>
  mount: kv
  type: kv-v2
  destination:
    # Must match service.envFrom in vshnKeycloak.yaml.
    name: keycloak-env
    create: true
    overwrite: true
