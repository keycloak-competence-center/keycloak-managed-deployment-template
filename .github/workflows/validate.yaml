# Checks the manifests on every push and merge request, without touching a cluster.
name: validate

on:
  push:
  pull_request:

env:
  # AppCat release whose VSHNKeycloak CRD the claim is validated against. Keep it
  # close to what runs on your zone; the fields VSHN accepts change with it.
  APPCAT_VERSION: v4.195.0
  APPFLOW_REGISTRY: test
  KUBECONFORM_VERSION: v0.8.0

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        run: |
          mkdir -p "$HOME/bin"
          curl -sfL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar xz -C "$HOME/bin" kubeconform
          echo "$HOME/bin" >> "$GITHUB_PATH"

      # No public schema catalog tracks the AppCat CRDs closely enough, so the schema
      # is generated from the CRD itself. additionalProperties: false is what makes
      # kubeconform -strict reject a misspelled field instead of ignoring it.
      - name: Generate VSHNKeycloak schema
        run: |
          mkdir -p schemas
          curl -sfL "https://raw.githubusercontent.com/vshn/appcat/${APPCAT_VERSION}/crds/vshn.appcat.vshn.io_vshnkeycloaks.yaml" \
            | yq -o=json '.spec.versions[] | select(.name == "v1") | .schema.openAPIV3Schema' \
            | jq 'walk(if type == "object" and has("properties") and (has("additionalProperties") | not) then . + {additionalProperties: false} else . end)' \
            > schemas/vshnkeycloak_v1.json

      - name: Check realm JSONs parse
        run: |
          for f in helm/files/realm-*.json; do
            jq empty "$f" || { echo "::error file=$f::invalid JSON"; exit 1; }
          done

      - env:
          NEWLINE: |2+

          SECRETS_JSON: "${{ toJson(secrets) }}"
          VARS_JSON: "${{ toJson(vars) }}"
        name: Helm Chart template
        run: |
          ENVV=$(jq -n --arg p 'APPFLOW_' 'env | with_entries(select(.key | startswith($p)))')
          VARS=$(jq -n --arg p 'APPFLOW_' 'env.VARS_JSON | fromjson? // {} |  with_entries(select(.key | startswith($p)))')
          SECRETS=$(jq -n --arg p 'APPFLOW_' 'env.SECRETS_JSON | fromjson? // {} | with_entries(select(.key | startswith($p)))')
          
          jq -n --arg p 'APPFLOW_' --argjson e "$ENVV" --argjson v "$VARS" --argjson s "$SECRETS" \
          '{env: ($e + $v + $s + ($e + $v + $s | with_entries(.key |= ltrimstr($p))))}' > "${PWD}/helm/vars.yaml"
          
          jq '.env | keys' "${PWD}/helm/vars.yaml"
          
          sudo chmod -R o+w $(printf '%s/helm' "$PWD")
          docker run -v "${PWD}:/data" -w /data ghcr.io/appuio/helm-v4:latest /bin/bash -c "/bin/helm dependency update '/data/helm'; /bin/helm template 'test' '/data/helm' --namespace '${NAMESPACE}' --values '/data/helm/values.yaml' --values '/data/helm/values.test.yaml' --values '/data/helm/vars.yaml'" \
            > /tmp/helm.yaml

      - name: Validate manifests
        run: |
          cat /tmp/helm.yaml \
            | kubeconform -strict -summary \
                -schema-location default \
                -schema-location 'schemas/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
                -
