---
# All secrets, variables and environment variables with the prefix APPFLOW_ present in the deploy github action
# will end up in this secret and be injected into the VSHNKeycloak.
# They are synced into the namespace of the actual StatefulSet...but the sync doesn't remove entries.
# To remove them from the VSHNKeycloak in the instance namespace again, set the value to an empty string and then create a support ticket here:
# https://control.vshn.net/tickets/_create and select "AppCat Service" as Affected System
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-keycloak-env
  namespace: {{ .Release.Namespace }}
data:
  {{- range $key, $value := .Values.env }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
---
