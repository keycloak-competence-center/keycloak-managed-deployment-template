# Example only. Do not commit real values. Create this Secret once by hand, or
# generate it from your secret store (Sealed Secrets, External Secrets, or the
# Vault Secrets Operator, see ../examples/vault/). The name has to match
# service.envFrom in vshnKeycloak.yaml.
#
# Only credentials belong here. Everything else that the realm JSONs interpolate
# is non-secret and lives in ../keycloak/env-configmap.yaml.
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-env
  namespace: <your-namespace>
type: Opaque
stringData:
  # Counterpart to the EXAMPLE_CLIENT_* entries in the ConfigMap.
  EXAMPLE_CLIENT_SECRET: <secret>
  # Counterpart to the EXAMPLE_IDP_* endpoint URLs in the ConfigMap.
  EXAMPLE_IDP_CLIENT_SECRET: <secret>
